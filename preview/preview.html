const NAMES = {"BreathingCycling": "呼吸", "BreathingFixed": "呼吸", "Fading": "渐变", "Pulse": "脉冲", "Marquee": "跑马", "CoveringMarquee": "铺色", "Alternating": "交替", "StarryNight": "星点", "Candle": "烛火", "Wave": "波浪", "TaiChi": "太极", "Swish": "彗星", "Fixed": "常亮"};
const LEDS = 12, LOW = [30, 39, 52];
const hex = c => [0, 2, 4].map(i => parseInt(c.slice(i, i + 2), 16));
const mix = (a, b, r) => a.map((v, i) => v + (b[i] - v) * r);
const frac = x => x - Math.floor(x);
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const breath = (t, p) => 0.24 + 0.76 * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / p));
function noise(a, b) { let h = Math.imul(a, 374761393) + Math.imul(b, 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) & 0xffff) / 65535; }

// Same model as RigPreview.cs in RGB Studio.
function led(zone, t, i, n) {
  const c = zone.colors.map(hex), first = c[0];
  const sf = { Slowest: 0.7, Normal: 1.4, Fast: 2 }[zone.speed] || 1;
  const dir = zone.direction === "Backwards" ? -1 : 1, length = zone.length || 4;
  switch (zone.effect) {
    case "BreathingCycling": case "BreathingFixed": { const p = 6.8 / sf; return mix(LOW, c[zone.effect === "BreathingFixed" ? 0 : Math.floor(t / p) % c.length], breath(t, p)); }
    case "Pulse": { const beat = 2.6 / sf, pr = t % beat, glow = Math.exp(-5.5 * pr) + 0.52 * Math.exp(-64 * (pr - 0.28) ** 2); return mix(LOW, c[Math.floor(t / beat) % c.length], 0.19 + 0.81 * Math.min(1, glow)); }
    case "Fading": { const step = (t * sf / 2.8) % c.length, k = Math.floor(step); return mix(c[k], c[(k + 1) % c.length], (1 - Math.cos(Math.PI * (step - k))) / 2); }
    case "Marquee": return frac((i * dir - t * sf * 6) / n) * n < length ? first : LOW;
    case "CoveringMarquee": { const p = 3.2 / sf, k = Math.floor(t / p), front = frac(t / p) * n, at = dir > 0 ? i : n - 1 - i; return at < front ? c[k % c.length] : c[(k + c.length - 1) % c.length]; }
    case "Alternating": { const block = Math.floor((i - t * sf * 3 * dir) / length); return c[((block % 2) + 2) % 2]; }
    case "StarryNight": { const clock = t * sf / 1.1 + noise(i, 7), dim = mix(LOW, first, 0.12); return noise(i, Math.floor(clock)) > 0.24 ? dim : mix(dim, first, Math.sin(Math.PI * frac(clock))); }
    case "Candle": { const level = 0.62 + 0.2 * Math.sin(t * 5.3) + 0.12 * Math.sin(t * 11.7 + 1.3) + 0.06 * Math.sin(t * 23.1); return mix(LOW, first, Math.max(0.25, Math.min(1, level))); }
    case "Wave": { const x = i / n * 2 - t * sf / 3.5 * dir; return mix(LOW, first, 0.12 + 0.88 * (0.5 + 0.5 * Math.cos(2 * Math.PI * x)) ** 2); }
    case "TaiChi": return c[frac(i / n - t * sf / 5 * dir) < 0.5 ? 0 : 1];
    case "Swish": return mix(LOW, first, Math.exp(-frac((t * sf * 7 - i) / n) * n / (n * 0.16)));

  return first;
}

function fan(g, x, y, r, ring, level) {
  const avg = ring.reduce((a, c) => a.map((v, i) => v + c[i] / ring.length), [0, 0, 0]);
  const glow = g.createRadialGradient(x, y, r * 0.2, x, y, r + 14);
  glow.addColorStop(0, css(avg, 0.34 * level)); glow.addColorStop(1, css(avg, 0));
  g.fillStyle = glow; g.beginPath(); g.arc(x, y, r + 14, 0, 7); g.fill();
  const sweep = 2 * Math.PI / ring.length;
  ring.forEach((c, s) => {
    const shown = mix(LOW, c, 0.35 + 0.65 * level), a0 = s * sweep - Math.PI / 2;
    g.strokeStyle = css(shown, 0.2); g.lineWidth = 10; g.beginPath(); g.arc(x, y, r, a0, a0 + sweep + 0.02); g.stroke();
    g.strokeStyle = css(shown); g.lineWidth = 3; g.beginPath(); g.arc(x, y, r, a0, a0 + sweep + 0.02); g.stroke();
  });
  g.fillStyle = "#5c6a7a"; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill();
}

function draw(g, scene, t) {
  g.clearRect(0, 0, 360, 270);
  g.fillStyle = "#1c2733"; g.strokeStyle = "#687f8f"; g.lineWidth = 1.2;
  g.fillRect(26, 22, 307, 220); g.strokeRect(26, 22, 307, 220);
  g.fillStyle = "#18212c"; g.fillRect(82, 45, 177, 123);
  g.fillStyle = "#42525f"; g.fillRect(112, 57, 82, 74);
  const ring = (z, f, fans) => Array.from({ length: LEDS }, (_, s) => led(scene.zones[z], t, f * LEDS + s, fans * LEDS));
  const [b, s, r] = scene.zones.map(z => z.brightness / 0.8);
  fan(g, 60, 86, 22, ring(2, 0, 1), r);
  [60, 115, 170].forEach((y, f) => fan(g, 300, y, 24, ring(1, f, 3), s));
  [105, 163, 221].forEach((x, f) => fan(g, x, 203, 23, ring(0, f, 3), b));
  let cooler = hex(scene.cooler.color);
  if (scene.cooler.breathing) cooler = mix(LOW, cooler, breath(t + 1.2, 7));
  fan(g, 149, 94, 24, Array(LEDS).fill(cooler), 0.8);
  scene.memory.slice(0, 2).forEach((c, k) => { g.fillStyle = css(hex(c), 0.55); g.fillRect(209 + k * 16, 54, 11, 75); g.fillStyle = css(hex(c)); g.fillRect(213 + k * 16, 57, 3, 69); });
}

const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const views = DECK.map(scene => {
  const card = document.createElement("div"); card.className = "card";
  const names = scene.zones.map(z => NAMES[z.effect] || z.effect);
  card.innerHTML = `<h2>${scene.name}<small>${scene.slug}${scene.by ? " · Qwen 设计" : ""}</small></h2><p>${scene.idea}</p><canvas width="720" height="540"></canvas>
    <div class="tags"><span>底排 ${names[0]}</span><span>侧排 ${names[1]}</span><span>后置 ${names[2]}</span></div>`;
  document.getElementById("grid").append(card);
  const g = card.querySelector("canvas").getContext("2d"); g.scale(2, 2);
  return { g, scene };
});
function frame(now) { views.forEach(v => draw(v.g, v.scene, still ? 3.3 : now / 1000)); if (!still) requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
